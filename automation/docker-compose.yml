services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workflow_demo
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow-demo-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    environment:
      AI_MODE: ${AI_MODE:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      DATABASE_URL: postgresql://workflow:${POSTGRES_PASSWORD:-workflow-demo-password}@postgres:5432/workflow_demo
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: workflow_demo
      DB_POSTGRESDB_USER: workflow
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-workflow-demo-password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-this-before-sharing}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Istanbul
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SHOPIFY_SHOP: ${SHOPIFY_SHOP:-}
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-07}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro

volumes:
  n8n_data:
  postgres_data:
